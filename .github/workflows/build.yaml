name: Rust

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: RUSTFLAGS='--cfg reqwest_unstable' cargo build --verbose
      - name: Upload error logs
        uses: actions/upload-artifact@v4
        with:
          name: dns-rs
          path: target/debug/dns-rs
          retention-days: 1
  libs-1:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: RUSTFLAGS='--cfg reqwest_unstable' cargo build --verbose
      - name: Upload error logs
        uses: actions/upload-artifact@v4
        with:
          name: dns-rs-lib1
          path: target/debug/dns-rs
          retention-days: 1
